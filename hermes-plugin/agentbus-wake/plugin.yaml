name: agentbus-wake
version: 0.3.1
description: "Wake-on-message: append new agentbus rows for this agent to each tool result. Bus name is the task_id of an in-process delegate_task child, else AGENTBUS_AGENT; no name means no output."
author: Marco Barbone
provides_hooks:
  - transform_tool_result
  - post_tool_call
  - pre_llm_call
